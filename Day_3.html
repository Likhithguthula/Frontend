<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name">
        <br>
        <br
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email">
        <br>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password">
        <br>
        <br>
        <label for="phone number">Phone number:</label>
        <input type="tel" id="phone" placeholder="Enter your phone number">
        <br>
        <br>
        <label for="Book your slot">Book your slot:</label>
        <input type="datetime-local" id="slot" placeholder="Select date and time">
        <br>
        <br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br>
        <br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <br>
        <br>
    </form>
    <hr>

    <form action="" method="POST">
        select your technology stack:
        <br>
        <input type="radio" id="Python" name="tec" value="Python">
        <label for="Python">Python Full Stack</label>
        <br>
        <input type="radio" id="Java" name="tec" value="Java">
        <label for="Java">Java Full Stack</label>
        <br>
        <input type="radio" id="Data Science" name="tec" value="Data Science">
        <label for="Data Science">Data Science</label>
        <br>
        <br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <br>
        <br>
    </form>
    <hr>

    <form action="" method="POST">
        select your Skills stack:
        <br>
        <input type="checkbox" id="Python" name="skill" value="Python">
        <label for="Python">Python</label>
        <br>
        <input type="checkbox" id="Java" name="skill" value="Java">
        <label for="Java">Java</label>
        <br>
        <input type="checkbox" id="Data Science" name="skill" value="Data Science">
        <label for="Data Science">Data Science</label>
        <br>
        <br>
        <input type="checkbox" required id="Terms">
        <label for="Terms">I agree to the terms and conditions</label>
        <br>
        <br>
        <button type="submit">Submit</button>
        <br>
        <br>

    </form>
    <hr>
</body>
</html>
