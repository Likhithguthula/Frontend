    <script>
       let students=[
       {name:'jai',marks:80},
       {name:'sravan',marks:60},
       {name:'jessy',marks:75},
       {name:'rahul',marks:90}
       ]

       for(i of students){
        grade=''
        if(i.marks>70){
            grade="A"
        }
        else if(i.marks>60){
            grade="B"
        }
        else{
            grade="C"
        }
        let container=document.getElementById('container')
        let output=`
        <div class='card'>
            <h1>${i.name}</h1>
            <div>${i.marks}</div>
            <p>${grade}</p>
        </div>
        `
        container.innerHTML+=output
        console.log(output)
       }
    </script>
